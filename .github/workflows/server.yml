name: Server (FastAPI) — test and deploy

# REST API «Менеджер задач» из папки server/ (задание 6).
#  - test:   PostgreSQL 16 как сервис -> миграции Alembic -> запуск uvicorn -> смоук-тест всех эндпоинтов
#  - deploy: выкладка кода сервера по SSH собственным action rsync-ssh-deploy (как сайт в deploy.yml)
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------- 1. test
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: tasks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/tasks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # таблицы создаёт только Alembic, create_all в проекте нет
      - name: Apply migrations
        run: alembic upgrade head

      - name: Show tables (\dt)
        run: PGPASSWORD=app psql -h localhost -U app -d tasks -c '\dt'

      - name: Start API
        run: |
          nohup uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/openapi.json > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/uvicorn.log"; exit 1

      - name: Smoke test (all endpoints and status codes)
        run: python tests/smoke_test.py http://127.0.0.1:8000

      - name: Middleware log
        if: always()
        run: cat "$RUNNER_TEMP/uvicorn.log"

  # ---------------------------------------------------------------- 2. deploy по SSH
  # Используется action https://github.com/777werona-afk/rsync-ssh-deploy (тег v1).
  # Постоянного сервера у проекта нет, поэтому job выкладывает код на sshd, поднятый на самом раннере,
  # и проверяет результат. Для реального сервера (например, Helios) замените host, user, path и ключ
  # на секреты DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_KEY, DEPLOY_KNOWN_HOSTS.
  deploy-ssh:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # на сервер едут только файлы приложения: без скриншотов отчёта и локального .env
      - name: Prepare release directory
        run: |
          mkdir -p release
          cp -r server/app server/migrations server/alembic.ini server/requirements.txt \
                server/docker-compose.yml server/.env.example release/

      - name: Start local sshd and create a key
        id: ssh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server rsync
          sudo service ssh start
          ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/id_server" -q
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat "$RUNNER_TEMP/id_server.pub" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          echo "user=$(whoami)" >> "$GITHUB_OUTPUT"
          {
            echo 'key<<EOF_KEY'
            cat "$RUNNER_TEMP/id_server"
            echo 'EOF_KEY'
          } >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH with rsync-ssh-deploy
        id: deploy
        uses: 777werona-afk/rsync-ssh-deploy@v1
        with:
          host: localhost
          user: ${{ steps.ssh.outputs.user }}
          path: /tmp/task-manager-api
          source: release
          key: ${{ steps.ssh.outputs.key }}
          delete: 'true'

      - name: Check the deployed copy
        run: |
          echo "Назначение: ${{ steps.deploy.outputs.destination }}"
          echo "Передано файлов: ${{ steps.deploy.outputs.files_transferred }}"
          test -f /tmp/task-manager-api/app/main.py
          test -f /tmp/task-manager-api/alembic.ini
          ls /tmp/task-manager-api/migrations/versions/*.py
