name: CI

# REST API «Менеджер задач» (папка server/), задание 7.
#   lint  — ruff (стиль и типичные ошибки)
#   test  — pytest на реальной PostgreSQL 16 (сервис-контейнер)
#   build — сборка образа и проверка всего стека через docker compose;
#           при push в main образ публикуется в GHCR и Docker Hub
#   deploy-ssh — выкладка кода сервера собственным action rsync-ssh-deploy (только main)
# build запускается только после успешных lint и test (needs), deploy-ssh — после build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: task-manager-api

defaults:
  run:
    working-directory: server

jobs:
  # ---------------------------------------------------------------- 1. lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  # ---------------------------------------------------------------- 2. test
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: tasks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/tasks
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/tasks_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to the main database
        run: alembic upgrade head

      # тесты сами создают БД tasks_test и накатывают на неё миграции
      - name: Run tests
        run: pytest -v

  # ---------------------------------------------------------------- 3. build
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # публикация в GitHub Container Registry
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # весь стек из docker-compose.yml: БД (healthcheck) -> миграции -> приложение
      - name: Start stack with docker compose
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test of the running container
        run: python3 scripts/smoke_test.py http://127.0.0.1:8000

      - name: Tests inside Docker (profile test)
        run: docker compose --profile test run --build --rm tests

      - name: Compose logs
        if: always()
        run: docker compose logs app db

      - name: Stop stack
        if: always()
        run: docker compose --profile test down -v

      - name: Image tags
        id: tags
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          sha="sha-${GITHUB_SHA::7}"
          tags="ghcr.io/${owner}/${IMAGE_NAME}:latest,ghcr.io/${owner}/${IMAGE_NAME}:${sha}"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            tags="${tags},docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest"
            tags="${tags},docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${sha}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags" | tr ',' '\n'

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # на pull request и в других ветках образ только собирается, в main — ещё и публикуется
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: server
          target: runtime
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub skipped
        if: env.PUBLISH == 'true' && env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::Секреты DOCKERHUB_USERNAME / DOCKERHUB_TOKEN не заданы — образ опубликован только в GHCR"

  # ---------------------------------------------------------------- 4. deploy по SSH
  # Собственный action https://github.com/777werona-afk/rsync-ssh-deploy (тег v1).
  # Постоянного сервера нет, поэтому код выкладывается на sshd, поднятый на раннере;
  # для реального сервера замените host, user, path и ключ на секреты репозитория.
  deploy-ssh:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release directory
        run: |
          mkdir -p release
          cp -r server/app server/migrations server/alembic.ini server/requirements.txt \
                server/Dockerfile server/docker-compose.yml server/.env.example release/

      - name: Start local sshd and create a key
        id: ssh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server rsync
          sudo service ssh start
          ssh-keygen -t ed25519 -N '' -f "$RUNNER_TEMP/id_server" -q
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat "$RUNNER_TEMP/id_server.pub" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          echo "user=$(whoami)" >> "$GITHUB_OUTPUT"
          {
            echo 'key<<EOF_KEY'
            cat "$RUNNER_TEMP/id_server"
            echo 'EOF_KEY'
          } >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH with rsync-ssh-deploy
        id: deploy
        uses: 777werona-afk/rsync-ssh-deploy@v1
        with:
          host: localhost
          user: ${{ steps.ssh.outputs.user }}
          path: /tmp/task-manager-api
          source: release
          key: ${{ steps.ssh.outputs.key }}
          delete: 'true'

      - name: Check the deployed copy
        run: |
          echo "Назначение: ${{ steps.deploy.outputs.destination }}"
          echo "Передано файлов: ${{ steps.deploy.outputs.files_transferred }}"
          test -f /tmp/task-manager-api/app/main.py
          test -f /tmp/task-manager-api/Dockerfile
